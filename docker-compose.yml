version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart_campus_db
    restart: always
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_secure_password
      POSTGRES_DB: smart_lost_and_found
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_admin -d smart_lost_and_found"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
